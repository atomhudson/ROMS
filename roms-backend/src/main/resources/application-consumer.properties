# ──── Consumer Profile ────
# Processes RabbitMQ messages only — no HTTP server.
spring.main.web-application-type=none

# Enable consumer listeners
oms.consumer.enabled=true

# Disable WebSocket notifier (no web server, can't broadcast)
oms.notifier.enabled=false

# Consumer thread pool
spring.rabbitmq.listener.simple.concurrency=15
spring.rabbitmq.listener.simple.max-concurrency=30
spring.rabbitmq.listener.simple.prefetch=20

# Dedicated connection pool
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
