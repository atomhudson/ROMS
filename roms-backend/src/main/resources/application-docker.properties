spring.application.name=oms.backend

spring.datasource.url=jdbc:mysql://mysql:3306/orderdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=oms-backend

# JWT Security — override these for production IdP
oms.security.jwt.issuer=${JWT_ISSUER:oms-dev}
oms.security.jwt.audience=${JWT_AUDIENCE:oms-api}

# Configurable Order Pipeline
oms.pipeline.statuses[0].name=CREATED
oms.pipeline.statuses[0].label=Order Placed
oms.pipeline.statuses[0].terminal=false
oms.pipeline.statuses[1].name=PROCESSING
oms.pipeline.statuses[1].label=Processing
oms.pipeline.statuses[1].terminal=false
oms.pipeline.statuses[2].name=PROCESSED
oms.pipeline.statuses[2].label=Processed
oms.pipeline.statuses[2].terminal=false
oms.pipeline.statuses[3].name=SHIPPED
oms.pipeline.statuses[3].label=Shipped
oms.pipeline.statuses[3].terminal=false
oms.pipeline.statuses[4].name=IN_TRANSIT
oms.pipeline.statuses[4].label=In Transit
oms.pipeline.statuses[4].terminal=false
oms.pipeline.statuses[5].name=OUT_FOR_DELIVER
oms.pipeline.statuses[5].label=Out for Delivery
oms.pipeline.statuses[5].terminal=false
oms.pipeline.statuses[6].name=DELIVERED
oms.pipeline.statuses[6].label=Delivered
oms.pipeline.statuses[6].terminal=true
oms.pipeline.statuses[7].name=CANCELED
oms.pipeline.statuses[7].label=Canceled
oms.pipeline.statuses[7].terminal=true
