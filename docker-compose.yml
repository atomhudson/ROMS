services:
  # ============================================
  # 1. MySQL Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: oms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max-connections=200 --innodb-buffer-pool-size=256M --innodb-log-file-size=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oms-network

  # ============================================
  # 2. RabbitMQ
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: oms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus return_per_object_metrics true"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./roms-monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oms-network

  # ============================================
  # 3. Backend API (HTTP only — no consumers)
  # ============================================
  backend:
    build:
      context: ./roms-backend
      dockerfile: Dockerfile
    container_name: oms-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev,api
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:MaxGCPauseMillis=100"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - oms-network

  # ============================================
  # 4. Backend Consumer (RabbitMQ only — no HTTP)
  # ============================================
  consumer:
    build:
      context: ./roms-backend
      dockerfile: Dockerfile
    container_name: oms-consumer
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev,consumer
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:MaxGCPauseMillis=100"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - oms-network

  # ============================================
  # 5. React Frontend (nginx)
  # ============================================
  frontend:
    build:
      context: ./roms-ui
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE=
        - REACT_APP_WS_URL=/ws
    container_name: oms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - oms-network

  # ============================================
  # 6. Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: oms-prometheus
    volumes:
      - ./roms-monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - oms-network

  # ============================================
  # 7. Grafana
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: oms-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oms-dashboard.json
    volumes:
      - ./roms-monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./roms-monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    networks:
      - oms-network

  # ============================================
  # 8. K6 Load Testing
  # ============================================
  # Run:  docker-compose --profile loadtest run k6
  # Spike: docker-compose --profile loadtest run -e SCENARIO=spike k6
  # Stress: docker-compose --profile loadtest run -e SCENARIO=stress k6
  k6:
    image: grafana/k6:latest
    container_name: oms-k6
    profiles:
      - loadtest
    volumes:
      - ./roms-load-test:/scripts
    environment:
      - SCENARIO=${SCENARIO:-standard}
    entrypoint: []
    command: ["sh", "-c", "k6 run --env BASE_URL=http://backend:8080 --env SCENARIO=${SCENARIO:-standard} /scripts/load-test.js"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oms-network

volumes:
  mysql_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  oms-network:
    driver: bridge
