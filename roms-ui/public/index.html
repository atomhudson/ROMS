<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f0f23" />
  <meta name="description" content="Real-Time Order Management System" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            dark: {
              50: '#e8e8f0',
              100: '#c4c4d4',
              200: '#9d9db8',
              300: '#76769c',
              400: '#585886',
              500: '#3a3a70',
              600: '#2d2d5e',
              700: '#1e1e44',
              800: '#14142e',
              900: '#0f0f23',
              950: '#0a0a18',
            },
            accent: {
              purple: '#8b5cf6',
              blue: '#3b82f6',
              cyan: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e',
              indigo: '#6366f1',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'flash': 'flash 1.5s ease-out',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideDown: {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            flash: {
              '0%': { backgroundColor: 'rgba(139, 92, 246, 0.2)' },
              '100%': { backgroundColor: 'transparent' },
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(139, 92, 246, 0.2)' },
              '100%': { boxShadow: '0 0 20px rgba(139, 92, 246, 0.4)' },
            },
          },
        },
      },
    }
  </script>
  <title>Order Management System</title>
</head>

<body class="bg-dark-950 text-white font-sans">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
